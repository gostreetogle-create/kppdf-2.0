# KPPDF 2.0 — Nginx configuration
# Установка: sudo ln -sf /path/to/deploy/nginx.conf /etc/nginx/sites-available/kppdf
#            sudo ln -sf /etc/nginx/sites-available/kppdf /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name kppdf.example.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kppdf.example.com;

    # SSL — заменить на реальные сертификаты (Let's Encrypt)
    ssl_certificate     /etc/nginx/ssl/kppdf.crt;
    ssl_certificate_key /etc/nginx/ssl/kppdf.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Корень фронтенда (Angular build)
    root /var/www/kppdf/dist/kppdf-2.0;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Статика — кеширование
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API-прокси на бэкенд
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # SSE для уведомлений (не буферизировать)
        proxy_buffering off;
        proxy_cache off;
    }

    # Загруженные файлы
    location /uploads/ {
        alias /var/www/kppdf/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # SPA-маршрутизация (все остальные пути → index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Запрет доступа к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
