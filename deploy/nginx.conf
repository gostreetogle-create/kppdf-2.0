# KPPDF 2.0 — nginx site config
# Разместить: /etc/nginx/sites-available/kppdf
# Ссылка:    ln -sf /etc/nginx/sites-available/kppdf /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name kppdf.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kppdf.local;

    # SSL — заменить на свои сертификаты
    ssl_certificate     /etc/ssl/certs/kppdf.crt;
    ssl_certificate_key /etc/ssl/private/kppdf.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1000;

    # Логи
    access_log /var/log/nginx/kppdf.access.log;
    error_log  /var/log/nginx/kppdf.error.log warn;

    # Static frontend
    root /opt/kppdf-2.0/dist/kppdf-2.0/browser;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy → Express backend (отрезаем /api/v1)
    location /api/ {
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Лимит тела запроса (для больших КП)
        client_max_body_size 50m;
    }

    # Health check (без авторизации)
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }
}
