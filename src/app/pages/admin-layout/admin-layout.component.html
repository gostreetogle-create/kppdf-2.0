<div class="layout">
  <!-- Sidebar -->
  <aside class="layout__sidebar">
    <div class="layout__logo">
      <i class="pi pi-file-pdf layout__logo-icon"></i>
      <span class="layout__logo-text">KPPDF</span>
    </div>

    <nav class="layout__nav">
      @for (item of navItems; track item.path) {
        <a
          class="layout__nav-link"
          [routerLink]="item.path"
          routerLinkActive="layout__nav-link--active"
          [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
          pTooltip="{{ item.label }}"
          tooltipPosition="right"
        >
          <i [class]="item.icon" class="layout__nav-icon"></i>
          <span class="layout__nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="layout__sidebar-footer">
      <p-button
        label="Выйти"
        icon="pi pi-sign-out"
        severity="secondary"
        [text]="true"
        styleClass="layout__logout-btn"
        (click)="logout()"
      />
    </div>
  </aside>

  <!-- Main -->
  <div class="layout__main">
    <header class="layout__header">
      <div class="layout__header-left">
        <h2 class="layout__page-title">KPPDF 2.0</h2>
      </div>
      <div class="layout__header-right">
        @if (authStore.user(); as user) {
          <span class="layout__user-name">{{ user.displayName }}</span>
          <p-avatar [label]="(user.displayName || '?')[0]" styleClass="layout__user-avatar" shape="circle" size="large" />
        }
      </div>
    </header>

    <main class="layout__content">
      <router-outlet />
    </main>
  </div>
</div>
