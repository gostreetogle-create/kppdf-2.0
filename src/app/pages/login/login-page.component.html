<div class="login">
  <div class="login__card">
    <h1 class="login__title">KPPDF 2.0</h1>
    <p class="login__subtitle">Вход в систему</p>

    @if (errorMessage(); as msg) {
      <p-message severity="error" [text]="msg" styleClass="login__error-msg" />
    }

    <form class="login__form" (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="login__field">
        <label class="login__label" for="username">Логин</label>
        <input
          pInputText
          id="username"
          type="text"
          [ngModel]="username()"
          (ngModelChange)="username.set($event)"
          name="username"
          placeholder="admin"
          autocomplete="username"
          required
        />
      </div>

      <div class="login__field">
        <label class="login__label" for="password">Пароль</label>
        <input
          pInputText
          id="password"
          type="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          placeholder="••••••"
          autocomplete="current-password"
          required
        />
      </div>

      <p-button
        type="submit"
        label="Войти"
        [loading]="loading()"
        [disabled]="loading()"
        styleClass="login__button"
      />
    </form>
  </div>
</div>
