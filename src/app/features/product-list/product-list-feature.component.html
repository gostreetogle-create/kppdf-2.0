@if (loading()) {
  <div class="product-list-feature__loading">
    <p-progressSpinner strokeWidth="3" />
    <p>Загрузка товаров…</p>
  </div>
} @else if (error(); as errorMessage) {
  <p-message severity="error" [text]="errorMessage" />
} @else {
  <section class="product-list-feature">
    <header class="product-list-feature__header">
      <h2 class="product-list-feature__title">Товары и услуги</h2>

      <p-selectButton
        [options]="kindOptions"
        optionLabel="label"
        optionValue="value"
        [ngModel]="selectedKind()"
        (ngModelChange)="onKindChange($event)"
      />
    </header>

    @if (isEmpty()) {
      <div class="product-list-feature__empty">
        <i class="pi pi-inbox product-list-feature__empty-icon"></i>
        <p class="product-list-feature__empty-text">
          {{ hasFiltered() ? 'Нет товаров в выбранной категории' : 'Список товаров пуст' }}
        </p>
      </div>
    } @else {
      <div class="product-list-feature__grid">
        @for (product of filteredProducts(); track product.id) {
          <app-product-card
            [product]="product"
            (clicked)="onProductClick(product.id)"
          />
        }
      </div>
    }
  </section>
}
